<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sister ❤️</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Floating bubbles -->
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>

    <!-- Main Card -->
    <main class="container">

        <!-- Heart -->
        <div class="heart">💙</div>

        <!-- Gifts -->
        <div class="gift-container">

            <div class="gift-box" id="flowerGift">🎁</div>

            <div class="gift-box" id="nckuGift">🎁</div>

        </div>

        <!-- Main Title -->
        <h1 id="title" class="title">Happy birthday my sister! :D</h1>

        <!-- Date Cards -->
        <div class="info">

            <div class="card">19/08/2008 - 19/08/2026</div>

            <div class="card">My sister 17th birthday :D</div>

        </div>

    </main>

    <div id="confetti-container"></div>

    <script src="./script.js"></script>

</body>
</html>
