<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Mom 💛</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>

    <main class="container">

        <div class="heart">💛</div>

        <div class="gift-container">

            <div class="gift-box" id="flowerGift">🎁</div>

            <div class="gift-box" id="HUBGift">🎁</div>

        </div>

        <h1 id="title" class="title">
            Happy birthday my dear mom! :D
        </h1>

        <div class="info">

            <div class="card">
                21/09/1984 - 21/09/2026
            </div>

            <div class="card">
                My dear mom's birthday
            </div>

        </div>

    </main>

    <div id="confetti-container"></div>

    <script>
        const flowerGift = document.getElementById("flowerGift");
        const HUBGift = document.getElementById("HUBGift");

        const nckuLogo = "./ncku-logo.png";

        const title = document.getElementById("title");

        let flowerOpened = false;
        let HUBOpened = false;


        function changeTitle(text) {

            title.style.opacity = 0;

            setTimeout(() => {

                title.innerHTML = text;
                title.style.opacity = 1;

            }, 300);

        }


        flowerGift.addEventListener("click", () => {

            flowerGift.innerHTML = "💐";

            changeTitle("You're the most gorgeous woman💖");

            flowerOpened = true;

            checkFinished();

        });


        HUBGift.addEventListener("click", () => {

            HUBGift.innerHTML =
                `<img src="./img/HUB-logo.png" alt="HUB Logo">`;

            changeTitle("You're the best teacher 🌟");

            HUBOpened = true;

            checkFinished();

        });


        function checkFinished() {

            if (flowerOpened && HUBOpened) {

                setTimeout(() => {

                    changeTitle(
                        "Thank you for always being the best mom ❤️"
                    );

                    title.style.fontSize = "2.55rem";

                    launchConfetti();

                }, 700);

            }

        }


        function launchConfetti() {

            const container =
                document.getElementById("confetti-container");

            const colors = [
                "#ff8fab",
                "#B3EBF2",
                "#ffd166",
                "#FFFFFF",
                "#cdb4db",
                "#95d5b2"
            ];


            for (let i = 0; i < 120; i++) {

                const confetti =
                    document.createElement("div");

                confetti.style.position = "fixed";

                confetti.style.width = "10px";
                confetti.style.height = "10px";

                confetti.style.borderRadius = "50%";

                confetti.style.left =
                    Math.random() * 100 + "vw";

                confetti.style.top = "-20px";

                confetti.style.background =
                    colors[
                        Math.floor(
                            Math.random() * colors.length
                        )
                    ];

                confetti.style.pointerEvents = "none";

                confetti.style.zIndex = "999";


                const duration =
                    3000 + Math.random() * 2500;

                container.appendChild(confetti);


                confetti.animate(
                    [
                        {
                            transform:
                                "translateY(0px) rotate(0deg)",
                            opacity: 1
                        },

                        {
                            transform:
                                `translateY(${window.innerHeight + 100}px) rotate(${720 * Math.random()}deg)`,
                            opacity: 0.8
                        }
                    ],
                    {
                        duration: duration,
                        easing: "ease-out"
                    }
                );


                setTimeout(() => {

                    confetti.remove();

                }, duration);

            }

        }
    </script>

</body>
</html>
